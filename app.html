  // ── the day's cards: they wait in the draw, come to the hand, are laid
  //    on the field, and rest at last in the grave. The deal renews at two
  //    in the morning. ──
  const hand = $('hand');
  const pile = $('pile');
  const drawPile = $('drawPile');
  const field = $('field');
  const HAND_MAX = 5;
  // the few words a card can carry, chosen so each one reads plainly
  const SHORT_NAME = {
    speak: 'speak your dream',
    reflect: 'reflect',
    listen_back: 'listen back',
    read_other: 'read aloud',
    add: 'add to it',
    listen_others: 'others\u2019 dreams',
    prompt_share: 'share a prompt',
    speak_other: 'their dream',
    instruction: 'hear guidance',
    fac_prompt: 'speak a prompt',
    fac_address: 'address',
    fac_bank: 'the bank',
  };
  // the order the deck offers itself: the morning's speaking, then the
  // facilitator's own, then the three that are always held, then the day
  const DECK_ORDER = ['act:speak', 'fac:prompt', 'fac:address',
    'tool:listen', 'tool:record', 'fac:bank', 'tool:library'];
  function deckRank(card) {
    const i = DECK_ORDER.indexOf(card.key);
    if (i >= 0) return i;
    if (card.tone === 'fac') return 1.5;
    return 100 + (card.act ? (((card.act.start % 24) + 24) % 24) : 24);
  }
  const BASE_TOOLS = [
    { key: 'tool:listen', label: 'listen', tool: 'listen', minutes: 30,
      svg: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M3 13c2-4.5 4-4.5 6 0s4 4.5 6 0 4-4.5 6 0"/></svg>' },
    { key: 'tool:library', label: 'library', tool: 'library',
      svg: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h10"/></svg>' },
    { key: 'tool:record', label: 'record', tool: 'record', plays: 5,
      svg: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>' },
  ];
  const FAC_TOOLS = [
    { key: 'fac:prompt', label: 'prompt', tool: 'fac_prompt',
      svg: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M12 4v10M8 8l4-4 4 4M5 19h14"/></svg>' },
    { key: 'fac:address', label: 'address', tool: 'fac_address',
      svg: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M4 10v4h4l6 4V6l-6 4H4zM18 8c1.6 1.8 1.6 6.2 0 8"/></svg>' },
    { key: 'fac:bank', label: 'the bank', tool: 'fac_bank',
      svg: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M4 8h16M4 12h16M4 16h16M8 4v16"/></svg>' },
  ];
  function facClassId() {
    const mine = (SDJ._classes || []).filter((m) => m.role === 'facilitator');
    return mine.length ? mine[0].class_id : null;
  }
  function dreamDay() {
    const d = new Date();
    if (d.getHours() < 2) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
      '-' + String(d.getDate()).padStart(2, '0');
  }
  function handState() {
    try {
      const s = JSON.parse(localStorage.getItem('sdj-hand') || 'null');
      if (s && s.day === dreamDay()) {
        s.inHand = s.inHand || [];
        s.onField = s.onField || [];
        s.grave = s.grave || [];
        s.played = s.played || [];
        return s;
      }
    } catch (e) {}
    return { day: dreamDay(), inHand: [], onField: [], grave: [], played: [],
      recordLeft: 5, listenLeft: 30 };
  }
  function keepHandState(s) {
    s.day = dreamDay();
    try { localStorage.setItem('sdj-hand', JSON.stringify(s)); } catch (e) {}
  }

  // every card the day could hold, wherever it happens to be
  function allCards() {
    const st = handState();
    const hour = SDJ.nowHour();
    const listenLive = lastWindows.filter((w) => !w.red).some((w) =>
      (w.kind === 'listen_others' || w.kind === 'listen_back') &&
      SDJ.currentActivities([w], hour).length);
    const out = [];
    // the day's exercises arrive as their hour comes round
    for (const w of lastWindows) {
      const started = ((hour % 24) + 24) % 24 >= (((w.start % 24) + 24) % 24) ||
        SDJ.currentActivities([w], hour).length > 0;
      if (!started) continue;
      out.push({ key: 'act:' + w.kind, label: w.label, act: w,
        tone: w.red ? 'fac' : 'now', turn: !!w.turn,
        short: SHORT_NAME[w.kind] || w.label });
    }
    for (const t of BASE_TOOLS) {
      out.push({ key: t.key, label: t.label, tool: t.tool, svg: t.svg, tone: 'always',
        shine: t.tool === 'listen' && listenLive,
        left: t.plays ? st.recordLeft : (t.minutes ? st.listenLeft : null),
        unit: t.plays ? 'plays' : (t.minutes ? 'min' : null) });
    }
    if (facClassId()) {
      for (const t of FAC_TOOLS) {
        out.push({ key: t.key, label: t.label, tool: t.tool, svg: t.svg, tone: 'fac' });
      }
    }
    return out;
  }
  const cardFor = (key) => allCards().find((x) => x.key === key) || null;
  function drawable() {
    const st = handState();
    const taken = st.inHand.concat(st.onField, st.grave);
    return allCards().filter((x) => taken.indexOf(x.key) < 0)
      .sort((a, b) => deckRank(a) - deckRank(b));
  }

  // ── the hand ──
  let handSig = '', flyFromDeck = null;
  function frameWidth() {
    return ($('frame') && $('frame').clientWidth) ||
      ((window.__sdjDevice && window.__sdjDevice.clientWidth) || window.innerWidth);
  }
  /* the card's own width, which grows where there is room for it */
  function cardW() {
    const v = getComputedStyle($('winBot')).getPropertyValue('--cw').trim();
    return parseInt(v, 10) || 60;
  }
  /* the floor the fan is dealt across: everything but the deck and the grave */
  function handRoom() { return Math.max(110, Math.min(620, frameWidth() - 200)); }
  function markLifts() {
    hand.querySelectorAll('.handSlot').forEach((s) => {
      s.classList.toggle('lift', handQueue.indexOf(s.dataset.key) >= 0);
    });
  }
  function cardFace(card) {
    const el = document.createElement('button');
    el.className = 'handCard tone-' + (card.tone || 'now') +
      (card.shine ? ' shining' : '') + (card.left === 0 ? ' spent' : '');
    el.innerHTML = (card.svg || '') +
      '<span class="cname">' + (card.short || card.label) + '</span>' +
      (card.left !== null && card.left !== undefined
        ? '<span class="pip">' + card.left + '</span>' : '');
    return el;
  }
  function renderHand(force) {
    if (!handReady || adminMode) return;
    const st = handState();
    const cards = st.inHand.map(cardFor).filter(Boolean);
    /* the hand is placed in pixels taken from the width of the frame, so a change
       of width is as much a change as a change of cards. Without it the hand keeps
       the offsets of the width it was dealt at and sits against one side. */
    const cw = cardW();
    const sig = Math.round(frameWidth()) + '|' + cw + '|' +
      cards.map((d) => d.key + ':' + (d.left === undefined ? '' : d.left)).join('|');
    if (!force && sig === handSig) { markLifts(); renderPiles(); renderField(); return; }
    handSig = sig;
    const step = cards.length > 1
      ? Math.max(18, Math.min(cw - 12, (handRoom() - cw) / (cards.length - 1))) : 0;
    const handW = cw + (cards.length - 1) * step + 10;
    hand.style.width = handW + 'px';
    // centred in the floor that the two piles leave free
    hand.style.left = Math.max(8, Math.round((frameWidth() - 88 - handW) / 2)) + 'px';
    hand.innerHTML = '';
    cards.forEach((card, i) => {
      const slot = document.createElement('div');
      slot.className = 'handSlot' + (handQueue.indexOf(card.key) >= 0 ? ' lift' : '');
      slot.dataset.key = card.key;
      slot._card = card;
      const el = cardFace(card);
      el.style.setProperty('--dur', (9 + (i % 5) * 1.7).toFixed(1) + 's');
      el.style.setProperty('--delay', (-(i * 1.9) % 9).toFixed(2) + 's');
      const t = i - (cards.length - 1) / 2;
      const spread = Math.min(9, 40 / Math.max(1, cards.length));
      slot.style.setProperty('--rot', (t * spread).toFixed(1) + 'deg');
      slot.style.setProperty('--arc', Math.round(t * t * 1.6) + 'px');
      slot.style.left = (i * step) + 'px';
      slot.appendChild(el);
      hand.appendChild(slot);
      // a drawn card travels from the deck to its place in the hand
      if (card.key === flyFromDeck) {
        const dp = drawPile.getBoundingClientRect(), hb = hand.getBoundingClientRect();
        if (dp.width) {
          slot.style.transition = 'none';
          slot.style.transform = 'translate(' + Math.round(dp.left - hb.left - i * step) +
            'px,' + Math.round(dp.top - hb.top) + 'px) rotate(-9deg)';
          slot.style.opacity = '0.92';
          requestAnimationFrame(() => requestAnimationFrame(() => {
            slot.style.transition = 'transform 1.05s cubic-bezier(.22,.9,.25,1), opacity .6s ease';
            slot.style.transform = '';
            slot.style.opacity = '';
            setTimeout(() => { slot.style.transition = ''; }, 1150);
          }));
        }
        flyFromDeck = null;
      }
    });
    hand.classList.toggle('deck', checkMode);
    if (checkMode) {
      hand.style.left = '8px';
      hand.style.width = '76px';
      const slots = [...hand.querySelectorAll('.handSlot')];
      slots.forEach((s, i) => {
        s.style.left = (i * 3) + 'px';
        s.style.setProperty('--rot', '0deg');
        s.style.setProperty('--arc', '0px');
      });
      const top = slots.length && slots[slots.length - 1].querySelector('.handCard');
      if (top) top.innerHTML = '<span class="pip big">' + cards.length + '</span>';
    }
    renderPiles();
    renderField();
  }
  // the whole draw, face up in two rows, for whoever keeps the room
  function canCheck() {
    return window.__sdjRole === 'admin' || !!facClassId();
  }
  function renderSpread() {
    const box = $('drawSpread'), btn = $('checkBtn');
    box.classList.toggle('on', checkMode);
    if (btn.parentNode === box) pile.parentNode.appendChild(btn);
    box.innerHTML = '';
    if (!checkMode) return;
    const waiting = drawable();
    const half = Math.ceil(waiting.length / 2);
    box.appendChild(btn);
    [waiting.slice(0, half), waiting.slice(half)].forEach((row) => {
      if (!row.length) return;
      const r = document.createElement('div');
      r.className = 'spreadRow';
      row.forEach((card, i) => {
        const el = cardFace(card);
        el.style.setProperty('--dur', (9 + (i % 5) * 1.7).toFixed(1) + 's');
        el.style.setProperty('--delay', (-(i * 1.9) % 9).toFixed(2) + 's');
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          setCheck(false);
          openCard(card);
        });
        r.appendChild(el);
      });
      box.appendChild(r);
    });
  }
  function setCheck(on) {
    checkMode = !!on && canCheck();
    document.body.classList.toggle('checking', checkMode);
    $('checkBtn').textContent = checkMode ? 'hide cards' : 'check cards';
    if (checkMode) { pileOpen = false; pilePick = null; document.body.classList.remove('graveOpen'); }
    haptic('grab');
    handSig = '';
    renderHand(true);
    renderSpread();
  }
  $('checkBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    setCheck(!checkMode);
  });

  // ── the draw and the grave ──
  function renderPiles() {
    const st = handState();
    const waiting = drawable();
    drawPile.classList.toggle('on', waiting.length > 0);
    drawPile.classList.toggle('fresh', waiting.length > 0 && st.inHand.length < HAND_MAX);
    drawPile.innerHTML = '';
    if (waiting.length) {
      const backs = Math.min(3, waiting.length);
      for (let i = 0; i < backs; i++) {
        const slot = document.createElement('div');
        slot.className = 'handSlot';
        slot.style.setProperty('--rot', ((i - 1) * 3).toFixed(1) + 'deg');
        slot.style.left = (i * 3) + 'px';
        const el = document.createElement('div');
        el.className = 'handCard back';
        el.style.setProperty('--dur', (10 + i * 1.6).toFixed(1) + 's');
        el.style.setProperty('--delay', (-(i * 2.2) % 9).toFixed(2) + 's');
        // the count rides the top card alone, with the word above it
        if (i === backs - 1) {
          el.innerHTML = (st.inHand.length < HAND_MAX ? '<span class="pip word">draw</span>' : '') +
            '<span class="pip big">' + waiting.length + '</span>';
        }
        slot.appendChild(el);
        drawPile.appendChild(slot);
      }

    }
    nextInWord(waiting.length);
    $('checkBtn').classList.toggle('on', canCheck() && !adminMode);
    if (checkMode) renderSpread();
    pile.classList.toggle('on', st.grave.length > 0);
    pile.classList.toggle('open', pileOpen);
    pile.innerHTML = '';
    if (!st.grave.length) return;
    if (!pileOpen) {
      pile.style.width = '';
      pile.style.left = '';
      const backs = Math.min(3, st.grave.length);
      for (let i = 0; i < backs; i++) {
        const slot = document.createElement('div');
        slot.className = 'handSlot';
        slot.style.setProperty('--rot', ((i - 1) * 4).toFixed(1) + 'deg');
        slot.style.left = (i * 3) + 'px';
        const el = document.createElement('div');
        el.className = 'handCard back';
        slot.appendChild(el);
        pile.appendChild(slot);
      }
      return;
    }
    // opened, the grave lays itself out exactly as the hand does
    const rows = st.played.slice().reverse().slice(0, 8);
    const step = rows.length > 1
      ? Math.max(18, Math.min(42, (handRoom() - 60) / (rows.length - 1))) : 0;
    const gw = 60 + (rows.length - 1) * step + 10;
    pile.style.width = gw + 'px';
    pile.style.left = Math.max(8, Math.round((frameWidth() - 88 - gw) / 2)) + 'px';
    rows.forEach((pl, i) => {
      const slot = document.createElement('div');
      slot.className = 'handSlot' + (pilePick === i ? ' lift' : '');
      const t = i - (rows.length - 1) / 2;
      const spread = Math.min(9, 40 / Math.max(1, rows.length));
      slot.style.setProperty('--rot', (t * spread).toFixed(1) + 'deg');
      slot.style.setProperty('--arc', Math.round(t * t * 1.6) + 'px');
      slot.style.left = (i * step) + 'px';
      const known = cardFor(pl.key);
      const el = known ? cardFace(known) : document.createElement('button');
      if (!known) {
        el.className = 'handCard played';
        el.innerHTML = '<span class="cname">' + pl.label + '</span>';
      }
      el.classList.add('graveCard');
      el.style.setProperty('--dur', (9 + (i % 5) * 1.7).toFixed(1) + 's');
      el.style.setProperty('--delay', (-(i * 1.9) % 9).toFixed(2) + 's');
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        pilePick = pilePick === i ? null : i;
        renderPiles();
        lastSig = '';
        showAt(SDJ.nowHour());
      });
      slot.appendChild(el);
      pile.appendChild(slot);
    });
  }
  // when nothing waits, the clock says when the next card comes
  function nextInWord(waiting) {
    const el = $('nextIn');
    if (waiting) { el.classList.remove('on'); return; }
    const hour = SDJ.nowHour();
    const nxt = SDJ.nextActivity(lastWindows.filter((w) => !w.red), hour);
    if (!nxt) { el.classList.remove('on'); return; }
    let diff = (((nxt.start % 24) + 24) % 24) - (((hour % 24) + 24) % 24);
    if (diff < 0) diff += 24;
    const h = Math.floor(diff), m = Math.round((diff - h) * 60);
    el.innerHTML = 'next card<br>' + (h ? h + 'h ' : '') + m + 'm';
    el.classList.add('on');
  }
  function drawOne() {
    const st = handState();
    if (st.inHand.length >= HAND_MAX) return false;
    const waiting = drawable();
    if (!waiting.length) return false;
    st.inHand.push(waiting[0].key);
    keepHandState(st);
    handSig = '';
    flyFromDeck = waiting[0].key;
    renderHand(true);
    return true;
  }
  drawPile.addEventListener('click', (e) => {
    e.stopPropagation();
    if (drawOne()) haptic('grab');
  });
  // ── 1. the first time the app opens in a day, the hand deals itself ──
  function dealTheDay() {
    const st = handState();
    if (st.dealt) return;
    st.dealt = true;
    keepHandState(st);
    let n = 0;
    const one = () => {
      if (!drawOne()) return;
      haptic('tick');
      n += 1;
      if (n < HAND_MAX) setTimeout(one, 620);
    };
    setTimeout(one, 900);
  }
  setInterval(() => { if (!adminMode) renderPiles(); }, 30000);

  // ── the field ──
  // the wheel takes every inch the board and the floor can spare
  function fitStage() {
    const t = $('winTop');
    if (!t || !t.clientHeight) return;
    const inv = $('signInvite');
    const tutor = document.body.classList.contains('tutoring') ? 100 : 0;
    const avail = t.clientHeight - 20 - 26 - 8 - tutor - (inv ? inv.offsetHeight + 6 : 0);
    const w = Math.max(160, Math.min(t.clientWidth * 0.9, avail * 1.052));
    document.documentElement.style.setProperty('--wheelW', Math.round(w) + 'px');
  }
  // the top window shows the wheel or the field; a tapped card brings the field up
  function showFace(which) {
    const st = $('stage'), b = $('faceBtn');
    const up = which === 'field';
    st.classList.toggle('fieldUp', up);
    if (b) b.querySelector('span').textContent = up ? 'wheel' : 'field';
    fitStage();
    requestAnimationFrame(() => { layoutBoard(); renderField(); lastSig = ''; showAt(SDJ.nowHour()); });
  }
  $('faceBtn').addEventListener('click', () => {
    haptic('tick');
    showFace($('stage').classList.contains('fieldUp') ? 'wheel' : 'field');
  });
  // one outline around both halves, bitten out where the piles stand
  function layoutBoard() {
    const board = $('board'), edge = $('boardEdge'), glass = $('boardGlass');
    if (!board || !edge) return;
    const b = board.getBoundingClientRect(), f = $('frame').getBoundingClientRect();
    const W = Math.round(b.width), H = Math.round(b.height);
    if (!W || !H) return;
    let nx = 0, ny = 0;
    if (nx > W * 0.42) nx = Math.round(W * 0.42);
    if (ny > H - 40) ny = H - 40;
    if (nx < 8 || ny < 8) { nx = 0; ny = 0; }
    const r = 13;
    const d = nx
      ? ['M', r, 0, 'H', W - r, 'A', r, r, 0, 0, 1, W, r,
         'V', H - ny, 'H', W - nx, 'V', H - r, 'A', r, r, 0, 0, 1, W - nx - r, H,
         'H', r, 'A', r, r, 0, 0, 1, 0, H - r, 'V', r, 'A', r, r, 0, 0, 1, r, 0, 'Z'].join(' ')
      : ['M', r, 0, 'H', W - r, 'A', r, r, 0, 0, 1, W, r, 'V', H - r,
         'A', r, r, 0, 0, 1, W - r, H, 'H', r, 'A', r, r, 0, 0, 1, 0, H - r,
         'V', r, 'A', r, r, 0, 0, 1, r, 0, 'Z'].join(' ');
    edge.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    edge.querySelector('.edge').setAttribute('d', d);
    const y = Math.round($('actBar').offsetHeight);
    edge.querySelector('.split').setAttribute('d', 'M 10 ' + y + ' H ' + (W - 10));
    if (glass) glass.style.clipPath = 'path("' + d + '")';
    board.style.setProperty('--notch', nx + 'px');
  }
  let sizeWait = 0;
  function onSize() {
    fitStage();
    renderHand();                 /* the hand and the piles are placed in pixels */
    renderPiles();
    renderField();
    layoutBoard();
  }
  window.addEventListener('resize', () => { clearTimeout(sizeWait); sizeWait = setTimeout(onSize, 60); onSize(); });
  /* a window of the Engine reaches its new width over a moment, and the frame is
     not the window: it is watched directly so the floor is laid out for the width
     it really ends up with */
  if (typeof ResizeObserver !== 'undefined') {
    const fr = $('frame');
    if (fr) new ResizeObserver(() => { clearTimeout(sizeWait); sizeWait = setTimeout(onSize, 60); }).observe(fr);
  }
  function renderField() {
    const st = handState();
    const cards = st.onField.map(cardFor).filter(Boolean);
    field.innerHTML = '';
    layoutBoard();
    if (!cards.length) return;
    if (!fieldSel || st.onField.indexOf(fieldSel) < 0) fieldSel = st.onField[st.onField.length - 1];
    const cw = cardW();
    const notch = parseInt(getComputedStyle($('board')).getPropertyValue('--notch'), 10) || 0;
    const room = Math.max(120, (field.clientWidth || 300) - notch - 12);
    const step = cards.length > 1
      ? Math.max(20, Math.min(cw + 14, (room - cw) / (cards.length - 1))) : 0;
    cards.forEach((card, i) => {
      const slot = document.createElement('div');
      slot.className = 'fieldCard' + (card.key === fieldSel ? ' sel' : '');
      slot.style.left = Math.round(10 + i * step) + 'px';
      slot.style.zIndex = String(10 + i);
      const el = cardFace(card);
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        fieldSel = card.key;
        haptic('tick');
        renderField();
        lastSig = '';
        showAt(SDJ.nowHour());
      });
      slot.appendChild(el);
      field.appendChild(slot);
    });
  }

  // ── choosing, and laying down ──
  let browsing = false, waveKey = null;
  function waveAt(e, host) {
    const slots = [...host.querySelectorAll('.handSlot')];
    if (!slots.length) return null;
    let best = null, bd = 1e9;
    for (const s of slots) {
      const r = s.getBoundingClientRect();
      const d = Math.abs(e.clientX - (r.left + r.width / 2));
      if (d < bd) { bd = d; best = s; }
    }
    if (!best) return null;
    if (best.dataset.key !== waveKey) {
      waveKey = best.dataset.key;
      haptic('tick');
      const at = slots.indexOf(best);
      slots.forEach((s, i) => {
        s.classList.toggle('wave', i === at);
        s.classList.toggle('near', Math.abs(i - at) === 1);
      });
    }
    return best;
  }
  function clearWave(host) {
    browsing = false;
    waveKey = null;
    host.querySelectorAll('.handSlot').forEach((s) => {
      s.classList.remove('wave');
      s.classList.remove('near');
    });
  }
  hand.addEventListener('pointerdown', (e) => {
    if (seqActive) return;
    browsing = true; waveKey = null;
    waveAt(e, hand);
  });
  hand.addEventListener('pointermove', (e) => { if (browsing) waveAt(e, hand); });
  hand.addEventListener('pointerup', (e) => {
    if (!browsing) return;
    const slot = waveAt(e, hand);
    clearWave(hand);
    if (!slot || !slot._card) return;
    const card = slot._card;
    if (seqActive || card.left === 0) return;
    setPileOpen(false);
    const at = handQueue.indexOf(card.key);
    if (at >= 0) handQueue.splice(at, 1);
    else { handQueue.push(card.key); showFace('field'); }
    haptic('grab');
    markLifts();
    lastSig = '';
    showAt(SDJ.nowHour());
  });
  hand.addEventListener('pointercancel', () => clearWave(hand));
  pile.addEventListener('pointerdown', (e) => {
    if (!pileOpen) return;
    browsing = true; waveKey = null;
    waveAt(e, pile);
  });
  pile.addEventListener('pointermove', (e) => { if (browsing && pileOpen) waveAt(e, pile); });
  pile.addEventListener('pointerup', () => { if (pileOpen) clearWave(pile); });
  pile.addEventListener('pointercancel', () => clearWave(pile));
  function setPileOpen(o) {
    pileOpen = o;
    pilePick = null;
    document.body.classList.toggle('graveOpen', !!o);
    if (!o) pile.style.width = '';
    renderPiles();
    lastSig = '';
    showAt(SDJ.nowHour());
  }
  pile.addEventListener('click', (e) => {
    if (e.target.closest('.handCard')) return;
    e.stopPropagation();
    setPileOpen(!pileOpen);
  });
  function queuedCard() {
    if (handQueue.length) {
      for (let i = handQueue.length - 1; i >= 0; i--) {
        const found = cardFor(handQueue[i]);
        if (found) return found;
      }
    }
    if (fieldSel) return cardFor(fieldSel);
    return null;
  }
  $('graveClose').addEventListener('click', (e) => {
    e.stopPropagation();
    setPileOpen(false);
    haptic('tick');
  });
  handReady = true;
  renderHand(true);
  dealTheDay();

  // ── the run: hand to field, field at last to the grave ──
  function markPlayed(card) {
    const st = handState();
    st.played.push({ key: card.key, label: card.label, at: Date.now() });
    keepHandState(st);
  }
  function attachPlayedDream(id, path) {
    const st = handState();
    if (!st.played.length || !id) return;
    st.played[st.played.length - 1].dream = id;
    st.played[st.played.length - 1].path = path || null;
    keepHandState(st);
  }
  const FIELD_MAX = 4;
  function layDown(card) {
    const st = handState();
    const i = st.inHand.indexOf(card.key);
    if (i >= 0) st.inHand.splice(i, 1);
    if (st.onField.indexOf(card.key) < 0) st.onField.push(card.key);
    // four stand at a time; the oldest that is finished with makes room,
    // and a tool keeps its place until its own count runs out
    while (st.onField.length > FIELD_MAX) {
      let out = st.onField.find((k) => {
        if (k === card.key) return false;
        const c2 = cardFor(k);
        return !c2 || !c2.tool || c2.left === 0;
      });
      if (!out) out = st.onField[0] === card.key ? st.onField[1] : st.onField[0];
      st.onField.splice(st.onField.indexOf(out), 1);
      if (st.grave.indexOf(out) < 0) st.grave.push(out);
      if (fieldSel === out) fieldSel = null;
    }
    keepHandState(st);
    fieldSel = card.key;
  }
  function spend(card) {
    const st = handState();
    if (card.tool === 'record') st.recordLeft = Math.max(0, (st.recordLeft || 0) - 1);
    if (card.tool === 'listen') st.listenLeft = Math.max(0, (st.listenLeft || 0) - 5);
    const done = card.act || (card.tool === 'record' && st.recordLeft <= 0) ||
      (card.tool === 'listen' && st.listenLeft <= 0) ||
      (!card.act && !card.tool);
    if (done) {
      const j = st.onField.indexOf(card.key);
      if (j >= 0) st.onField.splice(j, 1);
      if (st.grave.indexOf(card.key) < 0) st.grave.push(card.key);
      if (fieldSel === card.key) fieldSel = null;
    }
    keepHandState(st);
  }
  function openCard(card) {
    markPlayed(card);
    layDown(card);
    handSig = '';
    renderHand(true);
    if (card.tool === 'listen') listenMorePanel();
    else if (card.tool === 'library') toggleLibrary(true);
    else if (card.tool === 'record') sayMorePanel();
    else if (card.tool === 'fac_prompt') facPromptPanel();
    else if (card.tool === 'fac_address') facAddressPanel();
    else if (card.tool === 'fac_bank') facBankPanel();
    else if (card.act) openPanel(card.act);
    refreshCorners();
  }
  function beginRun() {
    seqCards = handQueue.map(cardFor).filter(Boolean);
    if (!seqCards.length && fieldSel) seqCards = [cardFor(fieldSel)].filter(Boolean);
    if (!seqCards.length) return;
    seqActive = true;
    seqIndex = 0;
    $('actBar').classList.add('fading');
    $('timing').classList.add('fading');
    haptic('grab');
    setTimeout(() => openCard(seqCards[0]), 700);
    refreshCorners();
  }
  function runForward() {
    if (!seqActive) return;
    closePanel();
    toggleLibrary(false);
    if (seqIndex >= 0 && seqCards[seqIndex]) spend(seqCards[seqIndex]);
    if (seqIndex < seqCards.length - 1) {
      seqIndex += 1;
      haptic('tick');
      openCard(seqCards[seqIndex]);
      refreshCorners();
      return;
    }
    endRun();
  }
  function runBack() {
    if (!seqActive) { closePanel(); toggleLibrary(false); refreshCorners(); return; }
    closePanel();
    toggleLibrary(false);
    if (seqIndex > 0) {
      seqIndex -= 1;
      haptic('tick');
      openCard(seqCards[seqIndex]);
      refreshCorners();
      return;
    }
    endRun(true);
  }
  function endRun() {
    seqActive = false;
    seqIndex = -1;
    seqCards = [];
    handQueue = [];
    closePanel();
    toggleLibrary(false);
    haptic('home');
    $('actBar').classList.remove('fading');
    $('timing').classList.remove('fading');
    handSig = '';
    hand.classList.add('dealing');
    renderHand(true);
    requestAnimationFrame(() => requestAnimationFrame(() => hand.classList.remove('dealing')));
    lastSig = '';
    setTimeout(() => { showAt(SDJ.nowHour()); refreshCorners(); }, 700);
    refreshCorners();
  }

  // ── the tutorial: one day, played out on this same screen ──
  let tutorWake = null;
  const tw = (ms) => new Promise((r) => {
    if (tutorialStop) { r(); return; }
    const t = setTimeout(() => { tutorWake = null; r(); }, ms);
    tutorWake = () => { clearTimeout(t); tutorWake = null; r(); };
  });
  function tutorSay(line, note) {
    if (tutorialStop) return;
    const bar = $('actBar');
    bar.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'flashCard tutorLine';
    card.innerHTML = '<span class="fcName">' + line +
      (note ? '<small>' + note + '</small>' : '') + '</span>';
    bar.appendChild(card);
    $('board').classList.add('quiet');
    $('board').classList.remove('live');
  }
  function tutorClock(hour) {
    const h = ((hour % 24) + 24) % 24;
    const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
    $('timing').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  }
  // the hand sweeps to an hour the way a clock is wound
  function turnTo(target, ms) {
    return new Promise((done) => {
      const from = tutorHour, span = target - from, t0 = performance.now();
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        tutorHour = target;
        renderTheWheel(tutorHour);
        tutorClock(tutorHour);
        done();
      };
      const step = (t) => {
        if (settled) return;
        const k = Math.min(1, (t - t0) / ms);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        tutorHour = from + span * e;
        renderTheWheel(tutorHour);
        tutorClock(tutorHour);
        if (k < 1 && !tutorialStop) requestAnimationFrame(step);
        else finish();
      };
      requestAnimationFrame(step);
      // the day keeps its appointment even if the frames stop coming
      setTimeout(finish, ms + 900);
    });
  }
  function tutorState(s) {
    localStorage.setItem('sdj-hand', JSON.stringify(Object.assign({
      day: dreamDay(), inHand: [], onField: [], grave: [], played: [],
      recordLeft: 5, listenLeft: 30, dealt: true }, s || {})));
    handSig = '';
    renderHand(true);
  }
  async function tutorDraw(n) {
    for (let i = 0; i < (n || 1); i++) {
      if (tutorialStop) return;
      if (!drawOne()) return;
      haptic('tick');
      await tw(1250);
    }
  }
  async function tutorPlay(note) {
    if (tutorialStop) return;
    const st = handState();
    const key = st.inHand[st.inHand.length - 1];
    const card = key && cardFor(key);
    if (!card) return;
    markPlayed(card);
    layDown(card);
    handSig = '';
    renderHand(true);
    haptic('grab');
    tutorSay(card.label, note);
    await tw(2600);
  }
  async function tutorRetire() {
    if (tutorialStop) return;
    const st = handState();
    const key = st.onField[0];
    if (!key) return;
    st.onField.shift();
    if (st.grave.indexOf(key) < 0) st.grave.push(key);
    const known = cardFor(key);
    st.played.push({ key: key, label: known ? known.label : key, at: Date.now() });
    keepHandState(st);
    fieldSel = st.onField[st.onField.length - 1] || null;
    handSig = '';
    renderHand(true);
    await tw(1500);
  }
  async function startTutorial() {
    if (tutorialOn) return;
    const keep = localStorage.getItem('sdj-hand');
    const realNow = SDJ.nowHour;
    tutorialOn = true;
    tutorialStop = false;
    openScreen(null);
    setCheck(false);
    setPileOpen(false);
    handQueue = [];
    fieldSel = null;
    document.body.classList.add('tutoring');
    fitStage();
    layoutBoard();
    tutorHour = 5.6;
    SDJ.nowHour = () => tutorHour;
    tutorState({});
    renderTheWheel(tutorHour);
    tutorClock(tutorHour);
    refreshCorners();
    try {
      tutorSay('A day turns once around the wheel.',
        'The hand is the hour you are in. Every arc is an activity waiting for its window.');
      await tw(4200);
      await turnTo(7.2, 2600);
      tutorSay('Morning Exercise opens at seven.',
        'When a window opens, its card comes to the draw.');
      await tw(3200);
      await tutorDraw(1);
      await tutorPlay('Ten to thirty minutes is a turn. Speak it while the dream is still close.');
      await tw(1200);
      await turnTo(12.6, 2600);
      tutorSay('Midday. Daydream opens.',
        'What you finished rests in the grave, and the day keeps dealing.');
      await tw(2600);
      await tutorRetire();
      await tutorDraw(1);
      await tutorPlay('A second turn, ten minutes long, on what you already made.');
      await tw(1200);
      await turnTo(17.4, 2600);
      tutorSay('Evening. Two windows are open at once.',
        'This is the sweet spot. Come back when several are open and one turn carries them all.');
      await tw(3600);
      await tutorDraw(2);
      await tutorPlay('Cards stay on the field until they are spent.');
      await tutorPlay('Four can stand there at a time, and the rest wait in the draw.');
      await tw(1200);
      await turnTo(21.6, 2600);
      tutorSay('Night School.', 'Your class arrives on the same wheel, in its own hours.');
      await tw(2800);
      await tutorDraw(1);
      await tutorPlay('The night keeps its own windows, and its own cards.');
      await tutorRetire();
      await tw(800);
      await turnTo(23.8, 2600);
      tutorSay('The day closes.',
        'At two in the morning the wheel turns over and a new hand deals itself. ' +
        'Ten to thirty minutes a turn, two or three turns a day, is the whole practice.');
      await tw(6000);
    } finally {
      SDJ.nowHour = realNow;
      tutorialOn = false;
      tutorialStop = false;
      document.body.classList.remove('tutoring');
      fitStage();
      layoutBoard();
      if (keep === null) localStorage.removeItem('sdj-hand');
      else localStorage.setItem('sdj-hand', keep);
      handQueue = [];
      fieldSel = null;
      handSig = '';
      lastSig = '';
      renderHand(true);
      renderTheWheel(SDJ.nowHour());
      showAt(SDJ.nowHour());
      refreshCorners();
      paint();
    }
  }
  function endTutorial() {
    tutorialStop = true;
    if (tutorWake) tutorWake();
  }
  function refreshCorners() {
    if (tutorialOn) {
      $('leftBtn').textContent = '\u00d7';
      $('rightBtn').textContent = '';
      $('leftBtn').classList.add('xOnly');
      $('rightBtn').classList.remove('xOnly');
      return;
    }
    if (document.body.dataset.admin) return;
    const inPanel = panel.classList.contains('open') || $('library').classList.contains('open');
    if (seqActive || inPanel) {
      $('leftBtn').textContent = 'back';
      $('rightBtn').textContent = (seqActive && seqIndex < seqCards.length - 1) ? 'forward' : 'done';
      $('rightBtn').style.color = 'var(--amber)';
    } else {
      $('leftBtn').textContent = 'menu';
      $('rightBtn').textContent = 'SOLOS';
      $('rightBtn').style.color = '';
    }
    $('leftBtn').classList.toggle('xOnly', $('leftBtn').textContent === '×');
    $('rightBtn').classList.toggle('xOnly', $('rightBtn').textContent === '×');
  }

  // ── the facilitator's three: they open on their own pages ──
  async function facRecordPanel(title, note, onPath) {
    const cidNow = facClassId();
    if (!cidNow) return;
    shell(title, note);
    const holder = document.createElement('div');
    const stage = SDJStage.record(holder, {
      onBlob: async (blob) => {
        let transcript = '';
        try {
          if (SDJ.transcribeNative && window.webkit && window.webkit.messageHandlers &&
              window.webkit.messageHandlers.transcribe) {
            transcript = (await SDJ.transcribeNative(blob)) || '';
          }
        } catch (e) {}
        const path = 'class/' + cidNow + '/' + Date.now() + '.m4a';
        const up = await c.storage.from('sdj-audio').upload(path, blob,
          { contentType: blob.type || 'audio/mp4' });
        if (up.error) throw up.error;
        await onPath(cidNow, path, transcript);
      },
    });
    panelStages.push(stage);
    panel.appendChild(holder);
    return;
  }
  async function facRecordPanelOld(title, note, onPath) {
    const cid = facClassId();
    if (!cid) return;
    const { back } = shell(title, note);
    back.style.display = 'none';
    const rec = SDJ.recorder();
    const btn = document.createElement('button');
    btn.className = 'recBig';
    btn.textContent = '●';
    const clock = document.createElement('div');
    clock.className = 'note';
    clock.textContent = 'tap to record';
    btn.onclick = async () => {
      if (!rec.active()) {
        await rec.start();
        btn.classList.add('on');
        btn.textContent = '■';
        clock.textContent = 'recording';
      } else {
        btn.classList.remove('on');
        btn.textContent = '●';
        clock.textContent = 'keeping it';
        const { blob, transcript } = await rec.stop();
        try {
          const path = 'class/' + cid + '/' + Date.now() + '.m4a';
          const up = await c.storage.from('sdj-audio').upload(path, blob,
            { contentType: blob.type || 'audio/mp4' });
          if (up.error) throw up.error;
          await onPath(cid, path, transcript);
          clock.textContent = 'kept';
        } catch (e2) { clock.textContent = e2.message; }
      }
    };
    panel.appendChild(btn);
    panel.appendChild(clock);
  }
  function facPromptPanel() {
    facRecordPanel('Speak a prompt into the bank',
      'It waits in the bank and goes out to the class.',
      async (cid, path, transcript) => {
        await c.from('sdj_class_prompts').insert({ class_id: cid, audio_path: path,
          body: transcript || '', created_by: user.id });
      });
  }
  function facAddressPanel() {
    facRecordPanel('Address the class',
      'Every member gets the notice, and hears you in their next window.',
      async (cid, path, transcript) => {
        await c.from('sdj_class_addresses').insert({ class_id: cid, audio_path: path,
          body: transcript || '', created_by: user.id });
      });
  }
  async function facBankPanel() {
    const cid = facClassId();
    const { back } = shell('The bank', 'Every dream in the room, out of sequence.');
    back.style.display = 'none';
    const { data: dreams } = await c.from('sdj_dreams').select('*')
      .eq('class_id', cid).order('created_at', { ascending: false }).limit(40);
    const rows = (dreams || []).filter((d) => d.audio_path);
    if (!rows.length) {
      panel.appendChild(Object.assign(document.createElement('div'), {
        className: 'note', textContent: 'The room is quiet so far.' }));
      return;
    }
    for (const d of rows) {
      const row = document.createElement('div');
      row.className = 'listRow';
      row.innerHTML = '<span class="nm">' + (d.day || '') + ' · ' + (d.kind || 'dream') + '</span>';
      const play = document.createElement('button');
      play.textContent = 'play';
      play.onclick = async () => { new Audio(await SDJ.audioUrl(d.audio_path)).play(); };
      row.appendChild(play);
      panel.appendChild(row);
    }
  }

  // ── the library: every recording, the way voice memos reads,
  //    ordered by when you listened ──
  function toggleLibrary(open) {
    const lib = $('library');
    lib.classList.toggle('open', open);
    if (open) renderLibrary();
  }
  const libHandle = $('libHandle');
  let libY0 = null;
  libHandle.addEventListener('pointerdown', (e) => { libY0 = e.clientY; libHandle.setPointerCapture(e.pointerId); });
  libHandle.addEventListener('pointermove', (e) => {
    if (libY0 == null) return;
    const dy = Math.max(0, e.clientY - libY0);
    $('library').style.transform = 'translateY(' + dy + 'px)';
  });
  libHandle.addEventListener('pointerup', (e) => {
    if (libY0 == null) return;
    const dy = e.clientY - libY0;
    libY0 = null;
    $('library').style.transform = '';
    if (dy > 110) toggleLibrary(false);
  });
  let libTab = 'recordings';
  async function renderLibrary() {
    const host = $('libRows');
    host.innerHTML = '';
    const tabs = document.createElement('div');
    tabs.className = 'libTabs';
    [['recordings', 'recordings'], ['reflections', 'reflections'],
     ['prompts', 'prompts'], ['listened', 'heard']].forEach(([key, label]) => {
      const b = document.createElement('button');
      b.className = 'libTab' + (libTab === key ? ' on' : '');
      b.textContent = label;
      b.onclick = () => { libTab = key; renderLibrary(); };
      tabs.appendChild(b);
    });
    host.appendChild(tabs);
    const body = document.createElement('div');
    host.appendChild(body);
    body.innerHTML = '<div class="note" style="padding:18px">Gathering\u2026</div>';
    const fmtDay = (s2) => new Date(s2).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const fmtTime = (s2) => new Date(s2).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    const rowFor = (title, sub, d) => {
      const row = document.createElement('div');
      row.className = 'libRow';
      row.innerHTML = '<div class="t">' + title + '</div><div class="s">' + sub + '</div>';
      if (d) {
        row.addEventListener('click', async () => {
          if (row.querySelector('.libOpen')) { row.querySelector('.libOpen').remove(); return; }
          const box = document.createElement('div');
          box.className = 'libOpen';
          const t = document.createElement('div');
          t.className = 'libTrans';
          t.textContent = d.transcript || d.body || 'No written words for this one.';
          box.appendChild(t);
          const btns = document.createElement('div');
          btns.className = 'libBtns';
          if (d.audio_path) {
            const play = document.createElement('button');
            play.textContent = '\u25b6 play';
            let au = null;
            play.addEventListener('click', async (e2) => {
              e2.stopPropagation();
              if (au && !au.paused) { au.pause(); play.textContent = '\u25b6 play'; return; }
              au = new Audio(await SDJ.audioUrl(d.audio_path));
              au.play();
              play.textContent = '\u275a\u275a pause';
              au.onended = () => { play.textContent = '\u25b6 play'; };
            });
            btns.appendChild(play);
          }
          if (d.user_id === user.id && d.id) {
            const del = document.createElement('button');
            del.className = 'danger';
            del.textContent = 'delete';
            del.addEventListener('click', async (e2) => {
              e2.stopPropagation();
              if (d.body !== undefined && !d.audio_path) {
                await c.from('sdj_reflections').delete().eq('id', d.id);
              } else {
                await c.from('sdj_dreams').delete().eq('id', d.id);
              }
              row.remove();
            });
            btns.appendChild(del);
          }
          box.appendChild(btns);
          row.appendChild(box);
        });
      }
      return row;
    };
    body.innerHTML = '';
    if (libTab === 'recordings') {
      const { data } = await c.from('sdj_dreams').select('*').eq('user_id', user.id)
        .neq('kind', 'reflection').order('created_at', { ascending: false }).limit(200);
      for (const d of (data || [])) {
        body.appendChild(rowFor('Your ' + (d.kind === 'addition' ? 'addition' : 'dream'),
          fmtDay(d.created_at) + ' \u00b7 ' + fmtTime(d.created_at), d));
      }
      if (!(data || []).length) body.innerHTML = '<div class="note" style="padding:18px">Nothing kept yet.</div>';
    } else if (libTab === 'reflections') {
      const spoken = await c.from('sdj_dreams').select('*').eq('user_id', user.id)
        .eq('kind', 'reflection').order('created_at', { ascending: false }).limit(100);
      const written = await c.from('sdj_reflections').select('*').eq('user_id', user.id)
        .order('created_at', { ascending: false }).limit(100);
      const all = [...(spoken.data || []), ...(written.data || [])]
        .sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
      for (const d of all) {
        body.appendChild(rowFor(d.audio_path ? 'A spoken reflection' : 'A written reflection',
          fmtDay(d.created_at) + ' \u00b7 ' + fmtTime(d.created_at), d));
      }
      if (!all.length) body.innerHTML = '<div class="note" style="padding:18px">No reflections yet.</div>';
    } else if (libTab === 'prompts') {
      const shares = await c.from('sdj_prompt_shares').select('*, sdj_prompts(*)')
        .eq('user_id', user.id).order('created_at', { ascending: false }).limit(100);
      const rows = (shares.data || []).map((s2) => ({
        id: s2.id, created_at: s2.created_at, user_id: user.id,
        body: s2.sdj_prompts ? s2.sdj_prompts.body : '' }));
      if (SDJ._classes && SDJ._classes.length) {
        const ids = SDJ._classes.map((m) => m.class_id);
        const cp = await c.from('sdj_class_prompts').select('*').in('class_id', ids)
          .order('created_at', { ascending: false }).limit(100);
        for (const q of (cp.data || [])) rows.push(q);
      }
      rows.sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
      for (const d of rows) {
        body.appendChild(rowFor(d.audio_path ? 'A spoken prompt' : 'A prompt',
          fmtDay(d.created_at) + ' \u00b7 ' + fmtTime(d.created_at), d));
      }
      if (!rows.length) body.innerHTML = '<div class="note" style="padding:18px">No prompts yet.</div>';
    } else {
      const acts = await c.from('sdj_activities').select('created_at,payload')
        .eq('user_id', user.id).eq('kind', 'listen_back')
        .order('created_at', { ascending: false }).limit(400);
      const heard = {};
      for (const a2 of (acts.data || [])) {
        const id2 = a2.payload && a2.payload.dream;
        if (id2 && !heard[id2]) heard[id2] = a2.created_at;
      }
      const ids = Object.keys(heard);
      if (!ids.length) {
        body.innerHTML = '<div class="note" style="padding:18px">Nothing heard yet.</div>';
      } else {
        const { data } = await c.from('sdj_dreams').select('*').in('id', ids.slice(0, 120));
        const list = (data || []).sort((a, b) => (heard[a.id] < heard[b.id] ? 1 : -1));
        for (const d of list) {
          body.appendChild(rowFor(d.user_id === user.id ? 'Your dream' : 'Another voice',
            'heard ' + fmtDay(heard[d.id]) + ' \u00b7 ' + fmtTime(heard[d.id]), d));
        }
      }
    }
  }

  // ── the stream: shuffled, unseen, only heard, with breath between ──
  async function listenMorePanel() {
    shell('Listening', '');
    const rows = [];
    const swapped = await c.from('sdj_swaps').select('*, sdj_dreams(*)')
      .eq('to_user', user.id).eq('kind', 'listen').limit(10);
    for (const s of (swapped.data || [])) if (s.sdj_dreams) rows.push(s.sdj_dreams);
    const mine = await c.from('sdj_dreams').select('*').eq('user_id', user.id)
      .order('created_at', { ascending: false }).limit(10);
    for (const d of (mine.data || [])) rows.push(d);
    if (!rows.length) {
      const seeds = await c.from('sdj_dreams').select('*').eq('is_seed', true).limit(6);
      for (const d of (seeds.data || [])) rows.push(d);
    }
    openListening(rows.filter((d) => d.audio_path), 'listen_back', 30);
  }

  // the recording card, straight from the speak window
  function sayMorePanel() {
    shell('Have more to say?', '');
    const r = recorderUI(async () => {
      await SDJ.logActivity('speak', { extra: true });
    }, 'spoken', null);
    panel.appendChild(r.btn); panel.appendChild(r.clock);
  }
})();
